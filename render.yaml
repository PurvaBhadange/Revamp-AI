services:
  # Backend Web Service
  - type: web
    name: revamp-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      # The following environment variables must be added securely in the Render Dashboard:
      # DATABASE_URL (from Neon)
      - key: DATABASE_URL
        sync: false
      # REDIS_URL (from Upstash)
      - key: REDIS_URL
        sync: false
      # UPSTASH_VECTOR_REST_URL (from Upstash)
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      # UPSTASH_VECTOR_REST_TOKEN (from Upstash)
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      # OPENAI_API_KEY
      - key: OPENAI_API_KEY
        sync: false

  # Background Worker (Celery)
  - type: worker
    name: revamp-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
