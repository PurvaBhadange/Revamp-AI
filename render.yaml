services:
  # Backend Web Service
  - type: web
    name: revamp-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      # The following environment variables must be added securely in the Render Dashboard:
      # DATABASE_URL (from Neon)
      - key: DATABASE_URL
        sync: false
      # REDIS_URL (from Upstash)
      - key: REDIS_URL
        sync: false
      # QDRANT_URL (from Qdrant Cloud or your own instance)
      - key: QDRANT_URL
        sync: false
      # QDRANT_API_KEY (if applicable)
      - key: QDRANT_API_KEY
        sync: false
      # OPENAI_API_KEY
      - key: OPENAI_API_KEY
        sync: false
