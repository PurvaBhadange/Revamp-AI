services:
  # Backend Web Service (Combined API + Celery Worker)
  - type: web
    name: revamp-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      # The following environment variables must be added securely in the Render Dashboard:
      # DATABASE_URL (from Neon)
      - key: DATABASE_URL
        sync: false
      # REDIS_URL (from Upstash)
      - key: REDIS_URL
        sync: false
      # UPSTASH_VECTOR_REST_URL (from Upstash)
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      # UPSTASH_VECTOR_REST_TOKEN (from Upstash)
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      # OPENAI_API_KEY
      - key: OPENAI_API_KEY
        sync: false
